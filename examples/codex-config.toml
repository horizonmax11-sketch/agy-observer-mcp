# Review and replace paths before adding to a trusted project's configuration.
[mcp_servers.agy_observer]
command = "/absolute/path/to/.venv/bin/python"
args = ["-m", "agy_observer.server"]
startup_timeout_sec = 30
# Covers the configurable 210s outer limit plus process cleanup and protocol overhead.
tool_timeout_sec = 240
enabled_tools = ["agy_info", "agy_history", "agy_status", "agy_run", "agy_cancel", "agy_discussion_create", "agy_discussion_read", "agy_discussion_note", "agy_discussion_turn", "agy_discussion_recover", "agy_council_create", "agy_council_note", "agy_council_round", "agy_council_reveal", "agy_council_assign_roles", "agy_discussion_memory", "agy_discussion_extend", "agy_project_read", "agy_project_update", "agy_project_link"]
default_tools_approval_mode = "prompt"

[mcp_servers.agy_observer.env]
AGY_OBSERVER_ENABLED = "0"
AGY_OBSERVER_CLI = "/absolute/path/to/agy"
AGY_OBSERVER_WORKSPACE = "/absolute/path/to/empty-workspace"
AGY_OBSERVER_STATE_DIR = "/absolute/path/to/private-state"
AGY_OBSERVER_MODEL = "gemini-3.8-flash-low"
AGY_OBSERVER_CLAUDE_MODEL = "claude-opus-4-6-thinking"

# Optional direct CLIs; keep Antigravity defaults unless explicitly selecting routes.
AGY_OBSERVER_CLAUDE_CLI = "claude"
AGY_OBSERVER_CODEX_CLI = "codex"
AGY_OBSERVER_CODEX_MODEL = "gpt-6.1-sol"
# AGY_OBSERVER_PARTICIPANTS = '{"claude":{"channel":"claude_code","model":"opus"}}'
