[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-observer-mcp"
version = "0.8.1"
description = "A bounded MCP bridge for Antigravity, Claude Code and Codex CLI with shared local discussions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["mcp>=1.30,<2"]
classifiers = ["Development Status :: 5 - Production/Stable", "Programming Language :: Python :: 3"]

[project.scripts]
agy-observer-mcp = "agy_observer.server:main"
agy-observer-demo = "agy_observer.demo:main"

[tool.setuptools.packages.find]
include = ["agy_observer*"]

[tool.setuptools.package-data]
agy_observer = ["static/*.html"]

[tool.black]
line-length = 100
