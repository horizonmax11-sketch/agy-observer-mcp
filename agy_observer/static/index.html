<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGY Observer · 对话记录</title>
<style>
:root{font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:#d9e1ea;background:#10151c}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;padding:20px 28px;border-bottom:1px solid #2a3440;display:flex;align-items:baseline;gap:24px}
h1{font-size:20px;margin:0}small,.muted{color:#a6b3c3}#connection{margin-left:auto}
main{display:grid;grid-template-columns:290px minmax(0,1fr);flex:1;min-height:0;overflow:hidden}
nav{padding:16px;border-right:1px solid #2a3440;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#runs,#sessions{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-top:12px}
select{width:100%;font:inherit;color:inherit;background:#171f29;padding:8px;border:1px solid #415b76;margin:6px 0}
.message{border:1px solid #354557;border-left:3px solid #78b9ff;padding:16px;margin:16px 0}.message.lead{border-left-color:#74c8a1}.message pre{max-height:360px;overflow:auto;margin-top:8px}.message small{display:block;overflow-wrap:anywhere}
.message.gpt{border-left-color:#74c8a1}.message.codex{border-left-color:#91bcec}.message.claude{border-left-color:#d6a1ef}.message.plan{border:2px solid #b9bb7b}
.message>pre{font:15px/1.8 "Segoe UI","Microsoft YaHei",sans-serif;background:transparent;padding:0;min-height:0;max-height:none}.message summary{padding:8px 0;font-size:13px}
label{display:block;padding:8px 0;color:#a6b3c3}input{accent-color:#78b9ff}
button{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:inherit;padding:12px;margin-bottom:8px;border-radius:4px;font:inherit;cursor:pointer;white-space:pre-wrap}
button:hover,button[aria-current=true]{background:#202d3c;border-color:#415b76}
button:focus-visible,summary:focus-visible{outline:2px solid #78b9ff}
article{padding:24px 32px;min-width:0;max-width:1200px;width:100%;overflow-y:auto;overscroll-behavior:contain}
h2{font-size:16px;margin:20px 0 8px}
pre{font:14px/1.65 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:16px;background:#171f29;border-radius:4px;min-height:48px}
#response{font-family:inherit;font-size:16px;line-height:1.8}#task{font-family:inherit;max-height:240px;overflow:auto}
.badge{display:inline-block;background:#244669;color:#d8ecff;padding:3px 10px;border-radius:4px;margin-right:10px}
#kind{color:#a6b3c3}#warning{color:#f6d293}summary{cursor:pointer;color:#a6b3c3;padding:16px 0}
dl{display:grid;grid-template-columns:90px 1fr;gap:4px 16px}dt{color:#a6b3c3}dd{margin:0;overflow-wrap:anywhere}
#roles{grid-template-columns:120px 1fr}#roles dt{white-space:nowrap}
#events{max-height:340px;overflow:auto}
#goal{max-height:120px;overflow:auto;overflow-wrap:anywhere}
@media(max-width:720px){
 main{grid-template-columns:1fr;grid-template-rows:150px minmax(0,1fr)}
 nav{padding:8px 16px;border-right:0;border-bottom:1px solid #2a3440}nav>.muted{display:none}
 label{padding:0}#runs,#sessions{padding-top:4px}#runs button{padding:6px 10px;margin-bottom:4px}
 header{padding:10px 16px;gap:8px;flex-wrap:wrap}header small{font-size:12px}article{padding:12px 16px}
}
</style>
<header><h1>AGY Observer</h1><small>本地对话记录（只读）</small><small id="connection">正在连接…</small></header>
<main>
 <nav aria-label="调用历史">
  <label for="view">查看内容</label><select id="view"><option value="runs">单次调用</option><option value="discussions">协作任务</option></select>
  <label><input id="show-tests" type="checkbox"> 显示离线测试与模拟记录</label>
  <div id="runs"></div><div id="sessions" hidden></div>
 </nav>
 <article>
 <section id="discussion" hidden><span class="badge" id="discussion-state"></span><h2 id="goal"></h2><div id="project-context"></div><details><summary id="role-heading">参与方式</summary><dl id="roles"></dl><p class="muted">关注重点可以跨越，不限制补充和质疑。模型名称取自请求记录，GPT 发言由客户端提交。每条发言的“依据与记录”保留完整型号、来源和上下文。</p></details><p class="muted" id="discussion-help">每轮由客户端发起。</p><div id="shared-plan"></div><div id="questions"></div><div id="messages"></div></section>
 <section id="single">
  <div><span id="state" class="badge">暂无记录</span><span id="kind"></span></div>
  <h2>用户</h2><pre id="task">暂无可见的对话记录。</pre>
  <h2 id="assistant-name">模型回复</h2><pre id="response" aria-live="polite"></pre>
  <h2>警告与错误信息</h2><pre id="warning"></pre>
  <details id="details"><summary>调用详情与事件记录</summary><dl id="meta"></dl><pre id="events"></pre></details>
  <p class="muted">仅展示公开事件与回复。心跳表示仍在等待，不代表生成进度。本页只读，不发起模型请求。</p>
 </section>
 </article>
</main>
<script>
let selected=null, pinned=false, allRows=[], detailKey=null, eventKey=null;
let selectedDiscussion=new URLSearchParams(location.search).get('discussion_id'), discussionKey=null, discussionData=null;
const sessionButtons=new Map();
const buttons=new Map(), el=id=>document.getElementById(id);
const states={created:'准备中',running:'生成中',success:'已完成',failed:'失败',timeout:'超时',cancelled:'已取消'};
const txt=(id,value)=>{const text=String(value??'');if(el(id).textContent!==text)el(id).textContent=text};
const kindLabel=row=>row.kind==='离线夹具'?'离线测试':row.kind;
const modelName=model=>!model?'未记录模型':/^gemini(?:-|$)/i.test(model)?'Gemini':/^claude(?:-|$)/i.test(model)?'Claude':/^gpt(?:-|$)/i.test(model)?'GPT':model;
const isTest=row=>row.kind.includes('离线')||row.kind.includes('模拟');
const fail=error=>txt('connection','连接中断：'+error.message);
el('view').value=selectedDiscussion||new URLSearchParams(location.search).get('view')==='discussions'?'discussions':'runs';
function updateAddress(){
 const url=new URL(location.href);url.searchParams.set('view',el('view').value);
 if(selectedDiscussion&&el('view').value==='discussions')url.searchParams.set('discussion_id',selectedDiscussion);else url.searchParams.delete('discussion_id');
 history.replaceState(null,'',url);
}
function switchView(){
 const discussion=el('view').value==='discussions';
 el('runs').hidden=discussion;el('sessions').hidden=!discussion;
 el('single').hidden=discussion;el('discussion').hidden=!discussion;
}
el('view').onchange=()=>{switchView();updateAddress()};switchView();
el('show-tests').checked=new URLSearchParams(location.search).get('tests')==='1';
async function read(path){const response=await fetch(path);if(!response.ok)throw Error(response.status);return response.json()}
function clearDetail(){
 detailKey=null;eventKey=null;txt('state','暂无记录');txt('kind','');txt('task','暂无可见的对话记录。');txt('assistant-name','模型回复');
 for(const id of ['response','warning','events'])txt(id,'');el('meta').replaceChildren();
}
async function renderEvents(key){
 if(!selected||!el('details').open||eventKey===key)return;
 const id=selected, rows=await read('/api/events/'+encodeURIComponent(id));
 if(id!==selected)return;
 txt('events',rows.map(row=>JSON.stringify(row)).join('\n'));eventKey=key;
}
async function renderDetail(){
 for(const [id,button] of buttons)button.setAttribute('aria-current',id===selected);
 const summary=allRows.find(row=>row.run_id===selected);
 if(!summary){clearDetail();return}
 const id=selected,key=id+':'+summary.last_event_utc;
 if(key!==detailKey){
  const row=await read('/api/status/'+encodeURIComponent(id));if(id!==selected)return;
  txt('state',states[row.state]||row.state);txt('kind',kindLabel(row));
  txt('task',row.task);txt('response',row.response||'正在等待公开回复…');
  txt('assistant-name',(row.channel==='codex_cli'?'Codex CLI':modelName(row.model_requested))+' 回复');
  txt('warning',[row.warnings,row.error_message||row.error,row.cleanup_error].filter(Boolean).join('\n')||'无');
  el('meta').replaceChildren();
  for(const [label,value] of [['参与者',row.participant||'未记录'],['来源',row.source||'未记录'],['渠道',row.channel||'未记录（旧版本）'],['运行',row.run_id],['请求模型',row.model_requested],['报告模型',row.model_reported||'CLI未报告'],['会话',row.conversation_id||'尚无'],['退出码',row.exit_code??'尚无'],['最近事件',row.last_event_utc]]){
   const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;el('meta').append(dt,dd);
  }
  detailKey=key;
 }
 await renderEvents(key);
}
async function updateHistory(){
 const rows=allRows.filter(row=>el('show-tests').checked||!isTest(row));
 if(!pinned||!rows.some(row=>row.run_id===selected))selected=rows[0]?.run_id;
 const visible=new Set(rows.map(row=>row.run_id)),known=new Set(allRows.map(row=>row.run_id));
 for(const [id,button] of buttons)if(!known.has(id)){button.remove();buttons.delete(id)}
 for(let index=0;index<allRows.length;index++){
  const row=allRows[index];let button=buttons.get(row.run_id);
  if(!button){
   button=document.createElement('button');button.type='button';
   button.onclick=()=>{selected=row.run_id;pinned=true;renderDetail().catch(fail)};
   buttons.set(row.run_id,button);el('runs').insertBefore(button,el('runs').children[index]||null);
  }
  button.hidden=!visible.has(row.run_id);
  const label=`${kindLabel(row)} · ${states[row.state]||row.state}\n${row.run_id}`;
  if(button.textContent!==label)button.textContent=label;
 }
 await renderDetail();
}
el('show-tests').onchange=()=>{pinned=false;el('runs').scrollTop=0;if(el('view').value==='runs')updateHistory().catch(fail)};
el('details').ontoggle=()=>{if(el('details').open)renderDetail().catch(fail)};
const messageKinds={proposal:'方案',feedback:'补充',decision:'选择',summary:'讨论小结',review:'建议',contribution:'发言',question:'提问',answer:'回应',challenge:'不同看法',revision:'调整想法',initial:'第一轮想法',plan:'方案草案',roles:'分工安排',observation:'补充想法',evidence:'补充信息',support:'支持',pass:'暂时没有补充'};
const resolutions={accepted:'采纳',rejected:'拒绝',deferred:'暂缓'};
function fillProject(data,who){
 const root=el('project-context');root.replaceChildren();if(!data.project)return;
 const versions=data.project.role_versions,latest=versions.at(-1),profile=latest?.brief||data.project.brief;
 const phase=document.createElement('p');phase.textContent=({understand:'① 了解项目：先看相同材料，各自找遗漏和需要澄清的地方。',assign:'② 确认重点与选角：三份理解已公开，先澄清分歧，再选择本阶段需要的三个角色。',work:'③ 按分工推进：'+profile.stage+' · 当前分工 v'+versions.length})[data.workflow_stage]||'';root.append(phase);
 const details=document.createElement('details'),summary=document.createElement('summary'),list=document.createElement('dl');summary.textContent='项目理解与材料';details.append(summary,list);
 for(const [key,label] of [['stage','当前阶段'],['materials','材料与已知内容'],['success_criteria','成功标准'],['constraints','约束'],['unknowns','待澄清的问题']]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=profile[key];list.append(dt,dd)}root.append(details);
 if(versions.length){const history=document.createElement('details'),title=document.createElement('summary');title.textContent='分工调整记录（'+versions.length+'版）';history.append(title);
  for(const v of versions){const heading=document.createElement('h3'),reason=document.createElement('p');heading.textContent='v'+v.version+' · '+v.stage;reason.textContent=v.rationale;history.append(heading,reason);
   for(const p of Object.keys(v.assignments)){const spec=v.assignments[p],text=document.createElement('p');text.textContent=who(p)+' · '+spec.role+'：'+spec.focus+'；产出：'+spec.output+'；选择原因：'+spec.reason;history.append(text)}
  }root.append(history);
 }
}
function fillDiscussion(data){
 const council=data.protocol==='council-v1',peer=data.protocol==='peer-v1';
 const recordedModels=[...new Set(data.messages.filter(m=>m.author==='reviewer'&&m.model_requested).map(m=>m.channel==='codex_cli'?'Codex CLI':modelName(m.model_requested)))];
 const who=(author,model)=>council?({gpt:'GPT（客户端）',gemini:'Gemini',claude:'Claude',codex:'Codex CLI'}[author]||author):author==='lead'?'GPT（客户端）':model?modelName(model):recordedModels.join(' / ')||'未记录模型';
 fillProject(data,who);
 txt('role-heading',data.project?(data.role_version?'本阶段分工 · v'+data.role_version:'项目分工（待共同选择）'):council?'项目分工'+(data.phase==='collect'?'（首轮公开后启用）':''):'参与方式');
 txt('discussion-help',isTest(data)?'离线演示：这里都是示例内容，没有调用模型。':council?'先各自想一想，再一起把方案改好。有不同看法可以直接提出，也可以补充信息或调整想法。':`${who('lead')} 与 ${who('reviewer')} 一起讨论。${peer?'可以接着聊、问问题，也可以换个角度看看。':''}`);
 txt('goal',data.goal);txt('discussion-state',`${data.kind} · ${data.closed?'已归档':council&&data.phase==='collect'?'首轮封存中':'讨论中'} · 模型尝试 ${data.model_attempts}/${data.max_model_turns}${council?' · '+Object.entries(data.attempts).map(([p,n])=>who(p)+' '+n+'/'+data.max_turns_per_model).join(' · '):''}`);
 el('roles').replaceChildren();
 for(const [role,brief] of Object.entries(data.roles)){
  const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=who(role);dd.textContent=brief;el('roles').append(dt,dd);
 }
 el('shared-plan').replaceChildren();
 const plan=council?[...data.messages].reverse().find(m=>m.kind==='plan'):null;
 if(plan){const title=document.createElement('h2'),body=document.createElement('pre'),note=document.createElement('p');title.textContent='当前方案草案 · v'+plan.plan_version;body.textContent=plan.content;note.className='muted';note.textContent='整理自 '+(plan.references||[]).map(i=>'#'+i).join('、')+'，各方的具体意见见下方。';el('shared-plan').append(title,body,note)}
 if(council&&data.phase==='collect'){const p=document.createElement('p');p.textContent='初判收集：'+Object.entries(data.initial_status||{}).map(([author,state])=>who(author)+' '+(states[state]||({missing:'尚未提交',interrupted:'已中断'}[state]||state))).join('；')+'。'+(data.reveal_ready?'已收齐，等待客户端显式公开。':'三份初判成功后才可公开；超时不视为收齐。')+'封存不限制本机操作者访问运行文件。';el('shared-plan').append(p)}
 if(council&&data.budget_exhausted){const p=document.createElement('p');p.className='muted';p.textContent='本轮模型调用已用完，接下来可以整理结果和还没解决的问题。';el('shared-plan').append(p)}
 el('questions').replaceChildren();
 const pending=data.open_questions||[];
 if(pending.length){
  const title=document.createElement('h2');title.textContent='等待回应的问题';el('questions').append(title);
  for(const q of pending){const p=document.createElement('p');p.textContent=`${who(q.author,data.messages[q.message_id-1]?.model_requested)} #${q.message_id}：${q.question}`;el('questions').append(p)}
  if(data.closed){const p=document.createElement('p');p.textContent='这些问题留待后续继续讨论。';el('questions').append(p)}
 }
 el('messages').replaceChildren();
 for(const row of data.messages){
  const card=document.createElement('section');card.className='message '+row.author+(row.kind==='plan'?' plan':'');card.id='message-'+row.id;
  const role=data.project&&row.role_version?data.project.role_versions[row.role_version-1]?.assignments[row.author]?.role:null;
  const title=document.createElement('strong');title.textContent=`#${row.id} ${(row.channel==='codex_cli'?'Codex CLI':who(row.author,row.model_requested))}${role?' · '+role+'（v'+row.role_version+'）':''} · ${data.project&&row.kind==='initial'?'项目理解':messageKinds[row.kind]||row.kind}${row.state?' · '+(states[row.state]||row.state):''}`;card.append(title);
  const record=document.createElement('details'),recordTitle=document.createElement('summary');recordTitle.textContent='依据与记录';record.append(recordTitle);
  const reference=document.createElement('small');reference.textContent=[row.reply_to?'回应 #'+row.reply_to:'',row.resolution?'选择：'+resolutions[row.resolution]:'',row.source?'来源 '+(row.source==='client'?'客户端提交':'外部CLI'):'',row.channel?'渠道 '+row.channel:'未记录渠道（旧版本）',row.participant?'参与者 '+who(row.participant):'',row.model_requested?'请求模型 '+row.model_requested:'',row.run_id?'调用 '+row.run_id:''].filter(Boolean).join(' · ');if(reference.textContent)record.append(reference);
  if(row.instruction){const instruction=document.createElement('p');instruction.textContent='本轮话题：'+row.instruction;record.append(instruction)}
  const content=document.createElement('pre');content.id='message-content-'+row.id;content.textContent=row.content||(row.state==='running'?'等待公开回复…':row.state==='success'?'没有公开正文。':'本次调用未完成，详情见“依据与记录”。');card.append(content);
  if(row.format==='plain-text'||row.protocol_warning?.includes('message包含')){const warning=document.createElement('p');warning.className='muted';warning.textContent='这条回复仍带有格式包装，已保留原文。';card.append(warning)}
  for(const [label,value] of [['接着这些发言',(row.references||[]).map(i=>'#'+i).join('、')],['补充依据',row.evidence],['调整原因',row.change_reason],['首轮上下文',row.initial_context?({fresh:'新上下文（客户端提交项按其声明记录）',history_visible:'已看过历史',unknown:'未确认'}[row.initial_context]||row.initial_context):'']]){if(value){const p=document.createElement('p');p.textContent=label+'：'+value;record.append(p)}}
  if(row.question&&row.kind!=='question'){const q=document.createElement('p');q.textContent='想问一下：'+row.question;card.append(q)}
  if(row.answers_to?.length){const a=document.createElement('small');a.textContent='回应的问题：'+row.answers_to.map(i=>'#'+i).join('、');record.append(a)}
  if(row.protocol_warning){const w=document.createElement('small');w.textContent=row.protocol_warning;record.append(w)}
  if(row.error){const error=document.createElement('p');error.textContent='错误：'+row.error;card.append(error)}
  if(row.content_truncated){const note=document.createElement('small');note.textContent='此处为回复摘录，完整内容请用 agy_status 查询上方调用编号。';card.append(note)}
  if(row.context){const label=document.createElement('p'),pre=document.createElement('pre');label.textContent='本轮共享上下文';pre.textContent=JSON.stringify(row.context,null,2);record.append(label,pre)}
  if(record.children.length>1)card.append(record);
  el('messages').append(card);
 }
 if(!data.messages.length){const p=document.createElement('p');p.textContent='尚无发言。任一伙伴都可以先开题，不要求客户端先交方案。';el('messages').append(p)}
}
async function updateDiscussions(rows){
 const visible=rows.filter(row=>el('show-tests').checked||!isTest(row));
 const known=new Set(rows.map(row=>row.discussion_id));
 for(const [id,button] of sessionButtons)if(!known.has(id)){button.remove();sessionButtons.delete(id)}
 for(let index=0;index<rows.length;index++){
  const row=rows[index];let button=sessionButtons.get(row.discussion_id);
  if(!button){button=document.createElement('button');button.type='button';button.onclick=()=>{selectedDiscussion=row.discussion_id;discussionKey=null;updateAddress()};sessionButtons.set(row.discussion_id,button);el('sessions').insertBefore(button,el('sessions').children[index]||null)}
  button.hidden=!visible.includes(row);const label=`${row.closed?'已归档':'协作中'} · 待答${row.open_questions_count||0} · ${row.model_attempts}/${row.max_model_turns}次尝试\n${row.goal_preview}`;if(button.textContent!==label)button.textContent=label;
 }
 if(!visible.some(row=>row.discussion_id===selectedDiscussion)){
  if(selectedDiscussion){
   discussionKey=null;discussionData=null;txt('goal','找不到此讨论，或已被离线测试筛选隐藏。');txt('discussion-state','未找到');txt('discussion-help','请从左侧选择讨论，或检查“显示离线测试”。');
   for(const id of ['project-context','roles','shared-plan','questions','messages'])el(id).replaceChildren();
   for(const button of sessionButtons.values())button.setAttribute('aria-current','false');return;
  }
  selectedDiscussion=visible[0]?.discussion_id;discussionKey=null;updateAddress();
 }
 for(const [id,button] of sessionButtons)button.setAttribute('aria-current',id===selectedDiscussion);
 if(!selectedDiscussion){discussionKey=null;discussionData=null;txt('goal','暂无协作任务');txt('discussion-state','暂无记录');txt('discussion-help','创建共同目标后，任一伙伴都可以先开题。');for(const id of ['project-context','roles','shared-plan','questions','messages'])el(id).replaceChildren();return}
 const row=visible.find(row=>row.discussion_id===selectedDiscussion),id=selectedDiscussion,key=id+':'+row.updated_utc;
 if(key!==discussionKey){
  const data=await read('/api/discussions/'+encodeURIComponent(id));if(id!==selectedDiscussion||el('view').value!=='discussions')return;
  discussionData=data;fillDiscussion(data);discussionKey=key;
 }
 for(const message of discussionData.messages.filter(m=>m.state==='running'&&m.run_id&&!m.sealed)){
  const status=await read('/api/status/'+encodeURIComponent(message.run_id));if(id!==selectedDiscussion||el('view').value!=='discussions')return;
  txt('message-content-'+message.id,(status.response||'等待公开回复…')+'\n\n实时预览：'+(states[status.state]||status.state)+'；协作记录尚待终态确认。');
 }
}
async function refresh(){
 const mode=el('view').value;
 try{
  if(mode==='discussions'){
   const rows=await read('/api/discussions');if(el('view').value===mode)await updateDiscussions(rows);
  }else{
   const rows=await read('/api/runs');if(el('view').value===mode){allRows=rows;await updateHistory()}
  }
  txt('connection','已连接 · '+new Date().toLocaleTimeString('zh-CN'));
 }catch(error){fail(error)}finally{setTimeout(refresh,750)}
}
refresh();
</script>
</html>
